[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lightfall-mcp-bridge"
dynamic = ["version"]
description = "MCP server bridging Claude Code to Lightfall via NATS"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md", "LEGAL.md"]
requires-python = ">=3.10"
authors = [
    { name = "ALS Controls Team" },
]
keywords = [
    "mcp",
    "control-system",
    "beamline",
    "lightfall",
    "nats",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "nats-py>=2.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/als-controls/lightfall-mcp-bridge"
Repository = "https://github.com/als-controls/lightfall-mcp-bridge"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/lightfall_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
