# Release pipeline, triggered by v* tags:
#   - build-dist: sdist + wheel, validated with twine check.
#   - publish-pypi: uploads to PyPI via OIDC trusted publishing (environment:
#     pypi; the publisher must be registered on pypi.org against this workflow
#     file — owner als-controls, repo lightfall-mcp-bridge, workflow
#     release.yml, environment pypi).
#   - release: attaches the wheel + sdist to a GitHub Release.
#
# Mirrors the main Lightfall repo's release.yml, minus the Briefcase app
# packaging (this is a library/server, not a desktop app).
#
# workflow_dispatch builds and validates without publishing — use it to test
# packaging changes without minting a tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs derives the version from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-pypi
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    needs: build-dist
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-pypi
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: build-dist
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-pypi
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          name: Lightfall MCP Bridge ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**
